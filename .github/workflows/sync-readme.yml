name: Sync README Models

on:
  push:
    branches:
      - main
    paths:
      - "benchmark/test_models.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync README with model catalog
        run: python3 scripts/sync_readme.py

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: sync README models [skip ci]"
            git push
          else
            echo "README already up to date"
          fi